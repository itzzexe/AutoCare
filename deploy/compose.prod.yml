# Production-style single-VPS layout (Linux). Only the reverse proxy publishes
# ports. Postgres, Redis, Ollama and ClamAV live on an internal network with
# no published ports. Secrets come from files provisioned by the operator
# (e.g. /etc/autocare/secrets/*, mode 0400) — never from this file or the image.
#
#   docker compose -f deploy/compose.prod.yml --env-file /etc/autocare/app.env up -d
# See docs/DEPLOYMENT.md before first use.

name: autocare

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  proxy:
    <<: *hardening
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [web]

  web:
    <<: *hardening
    image: ${WEB_IMAGE:-autocare-web:latest}
    read_only: true
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    user: "10001:10001"
    env_file: [/etc/autocare/app.env]
    environment:
      APP_ENV: production
      TRUSTED_PROXY_HOPS: "1"
      OLLAMA_URL: http://ollama:11434
      CLAMAV_HOST: clamav
    volumes:
      - uploads:/data/uploads
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1536M }
    networks: [edge, internal]
    depends_on: [postgres, redis]

  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: autocare
      POSTGRES_USER: autocare_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_password
    secrets: [pg_owner_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2048M }
    networks: [internal]

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    networks: [internal]

  ollama:
    <<: *hardening
    image: ollama/ollama:latest
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "16"
      OLLAMA_KEEP_ALIVE: "10m"
    volumes: [ollama:/root/.ollama]
    # GPU: uncomment on hosts with the NVIDIA container toolkit installed.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    networks: [internal]

  clamav:
    <<: *hardening
    image: clamav/clamav:1.4
    deploy:
      resources:
        limits: { memory: 2048M }
    networks: [internal]

networks:
  edge: {}
  internal:
    internal: true   # no egress from the data tier

secrets:
  pg_owner_password: { file: /etc/autocare/secrets/pg_owner_password }
  redis_password: { file: /etc/autocare/secrets/redis_password }

volumes:
  pgdata: {}
  uploads: {}
  ollama: {}
  caddy_data: {}
  caddy_config: {}
